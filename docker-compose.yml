# 基础设施（默认）：docker compose up -d
# 全栈部署：      docker compose --profile app up -d   （需 .env；前端仓库 interview-agent-web 与本仓库同级，或使用 CI 发布的镜像）
services:
  # Milvus 向量数据库（standalone 模式）
  etcd:
    image: quay.m.daocloud.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: docker.m.daocloud.io/milvusdb/milvus:v2.4.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Redis 缓存
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL 持久化存储（用户画像 / 面试记录 / 题库，JSONB + GIN）
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USERNAME:-interview}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-interview}
      POSTGRES_DB: interview_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-interview} -d interview_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- 应用服务（--profile app） ----------------
  backend:
    profiles: ["app"]
    image: ${BACKEND_IMAGE:-ghcr.io/dvdguzhou/interview-agent-backend:latest}
    build:
      context: .
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-}
    env_file: .env
    environment:
      PG_URL: jdbc:postgresql://postgres:5432/interview_agent
      REDIS_HOST: redis
      MILVUS_HOST: milvus
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
    restart: unless-stopped

  ml:
    profiles: ["app"]
    image: ${ML_IMAGE:-ghcr.io/dvdguzhou/interview-agent-ml:latest}
    build:
      context: ./ml
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-}
    env_file: .env
    environment:
      PG_DSN: postgresql+psycopg://${PG_USERNAME:-interview}:${PG_PASSWORD:-interview}@postgres:5432/interview_agent
      MILVUS_URI: http://milvus:19530
    restart: unless-stopped

  web:
    profiles: ["app"]
    image: ${WEB_IMAGE:-ghcr.io/dvdguzhou/interview-agent-web:latest}
    build:
      context: ../interview-agent-web
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-}
    restart: unless-stopped

  nginx:
    profiles: ["app"]
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - web
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  postgres_data:
