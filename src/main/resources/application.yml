server:
  port: 9090

spring:
  application:
    name: interview-agent

  # DashScope LLM Configuration
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      # 注：此属性在 Spring AI Alibaba 1.1.2.0 未真正绑定生效，实际 HTTP 超时由
      # RagHttpClientAutoConfig 的自定义 RestClientCustomizer 控制（默认 600s，可用
      # 环境变量 DASHSCOPE_READ_TIMEOUT 覆盖）
      read-timeout: 600
      chat:
        options:
          model: ${LLM_MODEL:qwen-plus}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v3}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

  # PostgreSQL / JPA
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/interview_agent}
    username: ${PG_USERNAME:interview}
    password: ${PG_PASSWORD:interview}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# Application Custom Config
app:
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
  jwt:
    secret: ${JWT_SECRET:interview-agent-default-secret}
    expiration: 86400000  # 24 hours
  github:
    token: ${GITHUB_TOKEN:}
  auth:
    enabled: ${AUTH_ENABLED:true}
  rag:
    reranker:
      # 重排策略：cross-encoder（DashScope gte-rerank 专用重排模型，默认，主流程出题用）| llm（大模型语义重排）| none（不重排）
      type: ${RERANKER_TYPE:cross-encoder}
      # cross-encoder 使用的 DashScope 重排模型；gte-rerank-v2 为当前可用版本
      cross-encoder-model: ${RERANK_MODEL:gte-rerank-v2}
  # Python ML 服务（ml/）：LlamaIndex 简历解析 + QLoRA 微调评分模型；未配置 base-url 时自动降级为纯 LLM 链路
  ml:
    base-url: ${ML_SERVICE_URL:}
    timeout-seconds: ${ML_SERVICE_TIMEOUT:60}
    resume-parser-enabled: ${ML_RESUME_PARSER_ENABLED:true}
    scorer-enabled: ${ML_SCORER_ENABLED:false}
