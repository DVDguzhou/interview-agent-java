[project]
name = "interview-ml"
version = "0.1.0"
description = "InterviewAgent 数据工程与模型服务：题库 ETL、SFT 数据集构建、QLoRA 评分模型微调、简历解析 / 评分 API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<2.6"]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "llama-index-core>=0.12",
    "llama-index-readers-file>=0.4",
    "pypdf>=4.0",
    "docx2txt>=0.8",
]
train = [
    "torch>=2.3",
    "transformers>=4.45",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "datasets>=3.0",
]

[project.scripts]
iml-etl = "interview_ml.etl.pipeline:main"
iml-build-sft = "interview_ml.sft.build_dataset:main"
iml-train = "interview_ml.train.qlora:main"
iml-eval = "interview_ml.train.evaluate:main"
iml-serve = "interview_ml.serving.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "B008"]
